name: No ar (manual, o relógio roda a cada 5 min)

on:
  workflow_dispatch:

concurrency:
  group: no-ar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  no-ar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: ./estado.sh abrir
      - run: python vigia.py no-ar
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
